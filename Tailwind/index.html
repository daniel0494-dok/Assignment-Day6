<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <style>
    body {
      font-family: system-ui, sans-serif;
      color: #0d121c;
    }
  </style>

  <body class="">
    <div class="flex">
      <!-- ASIDE -->
      <div
        class="hidden border-1 gap-4 border-gray-300 md:flex md:flex-col py-4 px-10 rounded-lg"
      >
        <p>LOGO</p>
        <ul class="flex flex-col gap-4">
          <li><a href="" class="font-bold hover:text-sky-500">Dashboard</a></li>
          <li><a href="" class="font-bold hover:text-sky-500">Course</a></li>
          <li><a href="" class="font-bold hover:text-sky-500">Class</a></li>
        </ul>
      </div>

      <div class="w-full">
        <!-- NAV -->

        <div
          class="p-4 relative w-full flex items-center justify-between border-1 border-gray-300"
        >
          <p class="font-bold">Daniel Oscar Kantong</p>
          <input type="checkbox" class="peer hidden" id="menu-toggle" />
          <label
            for="menu-toggle"
            class="md:hidden flex flex-col gap-1 cursor-pointer"
          >
            <span class="w-5 h-1 bg-sky-500 rounded-sm"></span>
            <span class="w-5 h-1 bg-sky-500 rounded-sm"></span>
            <span class="w-5 h-1 bg-sky-500 rounded-sm"></span>
          </label>
          <ul
            class="absolute peer-checked:flex flex-col hidden top-full bg-white w-full"
          >
            <li class="p-4"><a href="">Dashboard</a></li>
            <li class="p-4"><a href="">Course</a></li>
            <li class="p-4"><a href="">Class</a></li>
          </ul>
        </div>

        <div class="p-4 md:flex items-start">
          <div
            class="flex flex-col items-center p-10 text-center border-1 border-gray-300 rounded-lg"
          >
            <img
              src="asset/test.jpg"
              alt=""
              class="w-30 aspect-square object-cover object-top rounded-full"
            />
            <div class="flex gap-4 my-4">
              <div class="flex items-start gap-1">
                <img src="asset/edit.png" alt="" class="" />
                <button class="text-sky-500 font-bold cursor-pointer">
                  Change
                </button>
              </div>
              <div class="flex flex-start gap-1">
                <img src="asset/delete.png" alt="" />
                <button class="text-red-500 font-bold cursor-pointer">
                  Remove
                </button>
              </div>
            </div>
            <p>Provide clear photos! Hiring Partners will see you</p>
          </div>
          <div class="p-4 md:flex-1">
            <strong>Personal Info</strong>
            <div class="flex flex-col gap-2 p-4">
              <label for="username">Username</label>
              <input
                type="text"
                placeholder="daniel-oscar"
                id="username"
                class="bg-gray-200 py-2 px-4 rounded-full placeholder:text-gray-900"
              />
            </div>
            <div class="flex flex-col gap-2 p-4">
              <label for="email">Email</label>
              <input
                disabled
                type="text"
                placeholder="danieloscarkantong@gmail.com"
                id="email"
                class="bg-gray-200 py-2 px-4 rounded-full placeholder:text-gray-900"
              />
              <div class="">
                <span
                  >✅ Email verified.
                  <a class="text-sky-900 font-bold" href=""
                    >Change email?</a
                  ></span
                >
              </div>
            </div>
            <div class="flex flex-col gap-2 p-4">
              <label for="fullname">Fullname</label>
              <input
                type="text"
                placeholder="Daniel Oscar Kantong"
                id="fullname"
                class="bg-gray-200 py-2 px-4 rounded-full placeholder:text-gray-900"
              />
            </div>
            <div class="flex flex-col gap-2 p-4">
              <label for="headline">Headline</label>
              <input
                type="text"
                placeholder="Type here....."
                id="headline"
                class="bg-gray-200 py-2 px-4 rounded-full placeholder:text-gray-900"
              />
              <span class="text-gray-500"
                >You can fill in the headline with your area of interest or the
                job you want</span
              >
            </div>
            <div class="flex flex-col gap-2 p-4">
              <label for="headline">Headline</label>
              <textarea
                name=""
                id=""
                class="bg-gray-200 py-2 px-4 rounded-lg h-20 placeholder:text-gray-900"
                placeholder="Write evertyhting about you"
              ></textarea>
            </div>
            <div class="flex flex-row gap-4 p-4 w-full">
              <div class="flex flex-1 flex-col gap-2">
                <label for="headline">Place of birth</label>
                <input
                  type="text"
                  placeholder="Type here"
                  id="headline"
                  class="bg-gray-200 py-2 px-4 rounded-full placeholder:text-gray-900"
                />
              </div>
              <div class="flex flex-1 flex-col gap-2">
                <label for="headline">Date of birth</label>
                <input
                  type="date"
                  placeholder="Type here....."
                  id="headline"
                  class="bg-gray-200 py-2 px-4 rounded-full placeholder:text-gray-900"
                />
              </div>
            </div>
            <button
              class="font-bold bg-sky-500 w-full py-2 rounded-full text-white"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
